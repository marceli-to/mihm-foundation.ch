title: Editor
fields:
  -
    handle: content
    field:
      buttons:
        - h1
        - h2
        - h3
        - bold
        - italic
        - unorderedlist
        - removeformat
        - anchor
        - lead
      toolbar_mode: floating
      allow_source: true
      remove_empty_nodes: false
      type: bard
      display: Content
      container: assets
      collapse: true
      sets:
        elements:
          display: Elements
          icon: programming-module-box-cube
          sets:
            accordion:
              display: Accordion
              instructions: 'Add an accordion'
              icon: form-drop-down-menu
              fields:
                -
                  import: accordion
            address:
              display: Address
              instructions: 'Add a global address'
              icon: form-address-field
              fields:
                -
                  import: address
            image:
              display: Image
              instructions: 'Add a single image'
              icon: media-image-camera
              fields:
                -
                  import: image
            team:
              display: Team
              instructions: 'Add a group of team members'
              icon: add-user
              fields:
                -
                  import: team
            banner:
              display: Banner
              instructions: 'Add a themed banner'
              icon: align-object-center
              fields:
                -
                  import: banner
            teaser:
              display: 'Funding Teasers'
              instructions: 'Add teasers linking to funding areas'
              icon: layout-three-columns
              fields:
                -
                  import: teaser
            project_teasers:
              display: 'Project Teasers'
              instructions: 'Add a project teaser'
              icon: text-formatting-image-top
              fields:
                -
                  import: project_teasers
