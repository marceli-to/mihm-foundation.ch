title: Banner
fields:
  -
    handle: title
    field:
      type: text
      display: Title
  -
    handle: text
    field:
      buttons:
        - h2
        - h3
        - bold
        - removeformat
        - anchor
      toolbar_mode: floating
      allow_source: true
      remove_empty_nodes: false
      type: bard
      display: Text
      container: assets
  -
    handle: theme
    field:
      options:
        rose: Rose
        burgundy: Burgundy
        olive: Olive
        terracotta: Terracotta
      push_tags: false
      default: rose
      type: select
      display: Theme
      instructions_position: below
      instructions: 'Background color of the banner'
      width: 50
  -
    handle: text_color
    field:
      options:
        white: White
        black: Black
      push_tags: false
      default: white
      type: select
      display: Color
      instructions_position: below
      instructions: 'Text color of the banner'
      width: 50
