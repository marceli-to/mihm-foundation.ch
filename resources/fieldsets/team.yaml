title: Team
fields:
  -
    handle: category
    field:
      input_type: text
      antlers: false
      type: text
      display: Category
      icon: text
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
      validate:
        - required
  -
    handle: members
    field:
      type: grid
      display: Members
      icon: grid
      mode: stacked
      add_row: 'Add member'
      reorderable: true
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
      fields:
        -
          handle: firstname
          field:
            input_type: text
            antlers: false
            type: text
            display: Firstname
            icon: text
            instructions_position: above
            validate:
              - required
        -
          handle: name
          field:
            input_type: text
            antlers: false
            type: text
            display: Name
            icon: text
            instructions_position: above
            validate:
              - required
        -
          handle: position
          field:
            input_type: text
            antlers: false
            type: text
            display: Position
            icon: text
            instructions_position: above
            validate:
              - required
        -
          handle: image
          field:
            mode: list
            container: assets
            folder: team
            restrict: false
            allow_uploads: true
            show_filename: true
            show_set_alt: true
            max_files: 1
            type: assets
            display: Image
            icon: assets
            instructions_position: above
        -
          handle: linkedin
          field:
            input_type: text
            antlers: false
            type: text
            display: LinkedIn
            icon: text
            instructions_position: above
