title: 'Project Teasers'
fields:
  -
    handle: projects
    field:
      type: grid
      display: Projects
      icon: grid
      mode: stacked
      add_row: 'Add project'
      reorderable: true
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
      fields:
        -
          handle: project
          field:
            max_items: 1
            mode: default
            create: true
            collections:
              - projects
            type: entries
            display: Project
            icon: entries
            instructions_position: above
        -
          handle: layout
          field:
            options:
              narrow: Narrow
              wide: Wide
            taggable: false
            push_tags: false
            multiple: false
            clearable: false
            searchable: true
            cast_booleans: false
            default: wide
            type: select
            display: Layout
            icon: select
            instructions_position: above
