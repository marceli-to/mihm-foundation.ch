title: Page
tabs:
  main:
    display: Content
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Title
          -
            handle: page_elements
            field:
              collapse: true
              type: replicator
              display: 'Content elements'
              sets:
                elements:
                  display: Elements
                  sets:
                    editor:
                      display: Editor
                      instructions: 'Add an editor for content elements'
                      icon: text-formatting-markdown
                      fields:
                        -
                          import: editor
                    form:
                      display: Form
                      instructions: 'Add a form'
                      icon: form-text-field
                      fields:
                        -
                          import: form
                    banner:
                      display: Banner
                      instructions: 'Add a themed banner'
                      icon: align-object-center
                      fields:
                        -
                          import: banner
                    project_slideshow:
                      display: 'Project Slideshow'
                      instructions: 'Add a selection of projects'
                      icon: media-image-picture-gallery
                      fields:
                        -
                          import: project_slideshow
  seo:
    display: SEO
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
  settings:
    display: Settings
    sections:
      -
        display: Settings
        fields:
          -
            handle: page_theme
            field:
              options:
                olive: Olive
                burgundy: Burgundy
                terracotta: Terracotta
                rose: Rose
              push_tags: false
              type: select
              display: Theme
              default: rose
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
