title: Page
tabs:
  main:
    display: Inhalt
    sections:
      -
        display: Inhalt
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Titel
          -
            handle: page_elements
            field:
              collapse: true
              type: replicator
              display: 'Content elements'
              sets:
                neue_set-gruppe:
                  display: 'Neue Set-Gruppe'
                  sets:
                    editor:
                      display: Editor
                      instructions: 'Add an editor for content elements'
                      icon: text-formatting-markdown
                      fields:
                        -
                          import: editor
                    form:
                      display: Form
                      instructions: 'Add a form'
                      icon: form-text-field
                      fields:
                        -
                          import: form
                    banner:
                      display: Banner
                      instructions: 'Add a themed banner'
                      icon: align-object-center
                      fields:
                        -
                          import: banner
                    project_slideshow:
                      display: 'Project Slideshow'
                      instructions: 'Add a selection of projects'
                      icon: media-image-picture-gallery
                      fields:
                        -
                          import: project_slideshow
  seo:
    display: SEO
    sections:
      -
        display: SEO
        fields:
          -
            handle: open_graph_title
            field:
              type: text
              display: Title
              instructions: 'Can be used as a replacement for the page title'
              instructions_position: below
          -
            handle: open_graph_description
            field:
              type: textarea
              display: Description
              instructions_position: below
              instructions: 'One or two descriptive sentences about the content of the page.'
          -
            handle: open_graph_image
            field:
              max_files: 1
              container: assets
              type: assets
              display: Image
              instructions_position: below
              folder: images
              instructions: 'Image used for sharing on social media.'
  settings:
    display: Settings
    sections:
      -
        display: Settings
        fields:
          -
            handle: page_theme
            field:
              options:
                olive: Olive
                burgundy: Burgundy
                terracotta: Terracotta
                rose: Rose
              push_tags: false
              type: select
              display: Theme
              default: rose
          -
            handle: template
            field:
              type: template
              display: Template
              localizable: true
          -
            handle: layout
            field:
              type: template
              display: Layout
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
